name: CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (backend)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements file found; skipping pip install"
          fi

      - name: Run backend tests
        run: |
          pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          # try fast, reproducible install first; fall back if necessary
          if npm ci --prefer-offline --no-audit --no-fund; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install with legacy peer deps"
            npm install --legacy-peer-deps
          fi

      - name: Run frontend tests
        run: |
          # run vitest if present, otherwise run `npm test` if defined
          if [ -f package.json ] && grep -q '"vitest"' package.json; then
            npx vitest run
          elif npm run | grep -q "test"; then
            npm test --silent
          else
            echo "No test runner detected in package.json — skipping frontend tests"
          fi
