version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/uploads:/app/uploads
      - ./backend/app/db.sqlite3:/app/db.sqlite3
    environment:
      - DATABASE_URL=sqlite:///app/db.sqlite3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
